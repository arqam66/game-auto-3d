<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e7a38"/>
      <stop offset="100%" stop-color="#0e3b1a"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="16" cy="26" rx="9" ry="2" fill="#000" opacity="0.25"/>
  <!-- chassis -->
  <path d="M 10 16 L 10 20 L 22 20 L 22 16 L 20 13 L 14 13 Z" fill="url(#g)" filter="#s"/>
  <!-- canopy -->
  <path d="M 12 13 L 20 13 L 20 10 L 12 10 Z" fill="#f7f7f2" filter="#s"/>
  <path d="M 12 11 L 20 11 L 19 10 L 13 10 Z" fill="#e8ecee" opacity="0.6"/>
  <!-- wheels -->
  <circle cx="11" cy="21" r="2.5" fill="#222" filter="#s"/>
  <circle cx="21" cy="21" r="2.5" fill="#222" filter="#s"/>
  <!-- hubs -->
  <circle cx="11" cy="21" r="1" fill="#ffb020"/>
  <circle cx="21" cy="21" r="1" fill="#ffb020"/>
  <!-- windows -->
  <rect x="14" y="14" width="2" height="4" rx="0.5" fill="#b9c6d8"/>
  <rect x="17" y="14" width="2" height="4" rx="0.5" fill="#b9c6d8"/>
  <!-- marigold accent stripe -->
  <path d="M 11 18 L 21 18" stroke="#ffb020" stroke-width="1.2" stroke-linecap="round"/>
</svg>
